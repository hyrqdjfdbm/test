        <div v-else class="empty-panel">

    <!-- 添加/编辑节点弹窗 -->

              <button type="button" class="btn btn-sm btn-success" @click="addAttachment">+ 添加附件</button>

        <div class="modal-footer">

    </div>

    <!-- 新建模板弹窗 -->
    <div v-if="showCreateTemplateModal" class="modal-overlay" @click="showCreateTemplateModal = false">
      <div class="modal-content" @click.stop>
        <div class="modal-header">
          <h3>新建模板</h3>
          <button class="modal-close" @click="showCreateTemplateModal = false">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>模板名称 *</label>
            <input v-model="newTemplateName" type="text" placeholder="请输入模板名称" />
          </div>
          <div class="form-group">
            <label>复制现有模板</label>
            <select v-model="copyFromTemplateId" class="single-select">
              <option value="">不复制，创建空白模板</option>
              <option v-for="template in templates" :key="template.id" :value="template.id">
                {{ template.name }}
              </option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" @click="showCreateTemplateModal = false">取消</button>
          <button class="btn btn-primary" @click="createTemplate">创建</button>
        </div>
      </div>
    </div>

    <!-- 重命名模板弹窗 -->
    <div v-if="showRenameTemplateModal" class="modal-overlay" @click="showRenameTemplateModal = false">
      <div class="modal-content" @click.stop>
        <div class="modal-header">
          <h3>重命名模板</h3>
          <button class="modal-close" @click="showRenameTemplateModal = false">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>新模板名称 *</label>
            <input v-model="renameTemplateName" type="text" placeholder="请输入新模板名称" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" @click="showRenameTemplateModal = false">取消</button>
          <button class="btn btn-primary" @click="renameTemplate">确定</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script setup>
import { ref, reactive, computed, watch } from 'vue'

// 部门选项
const departments = [
  '项目管理部',
  '设计部',
  '工程部',
  '质量监督部',
  '规划审批部',
  '技术评审部',
  '行政审批部',
  '验收委员会',
  '档案管理部',
  '财务部',
  '人力资源部',
  '市场部'
]

// 人员选项
const users = [
  '张三',
  '李四',
  '王五',
  '赵六',
  '钱七',
  '孙八',
  '周九',
  '吴十',
  '郑十一',
  '王十二',
  '冯十三',
  '陈十四',
  '刘十五',
  '杨十六',
  '黄十七',
  '朱十八'
]

// 默认节点结构
const createDefaultNode = () => ({
  id: 'root',
  name: '项目流程',
  level: 1,
  sortOrder: 0,
  expanded: true,
  needReview: false,
  reportDepartment: [],
  reportUsers: [],
  reviewDepartment: [],
  reviewUsers: [],
  warningBaseNode: '',
  warningDays: 0,
  children: []
})

// 模板列表
const templates = reactive([
  {
    id: 'template1',
    name: '标准项目流程',
    nodes: {
      id: 'root',
      name: '项目流程',
      level: 1,
      sortOrder: 0,
      expanded: true,
      needReview: false,
      reportDepartment: [],
      reportUsers: [],
      reviewDepartment: [],
      reviewUsers: [],
      warningBaseNode: '',
      warningDays: 0,
      children: [
        {
          id: 'node1',
          name: '项目立项',
          level: 2,
          sortOrder: 1,
          expanded: false,
          needReview: true,
          reportDepartment: ['项目管理部'],
          reportUsers: ['张三', '李四'],
          reviewDepartment: ['规划审批部'],
          reviewUsers: ['王五', '赵六'],
          warningBaseNode: '',
          warningDays: 3,
          children: []
        },
        {
          id: 'node2',
          name: '方案设计',
          level: 2,
          sortOrder: 2,
          expanded: false,
          needReview: true,
          reportDepartment: ['设计部'],
          reportUsers: ['钱七', '孙八'],
          reviewDepartment: ['技术评审部'],
          reviewUsers: ['周九', '吴十'],
          warningBaseNode: '',
          warningDays: 7,
          children: []
        },
        {
          id: 'node3',
          name: '施工审批',
          level: 2,
          sortOrder: 3,
          expanded: false,
          needReview: true,
          reportDepartment: ['工程部'],
          reportUsers: ['郑十一'],
          reviewDepartment: ['行政审批部'],
          reviewUsers: ['王十二', '冯十三'],
          warningBaseNode: '',
          warningDays: 5,
          children: []
        },
        {
          id: 'node4',
          name: '项目验收',
          level: 2,
          sortOrder: 4,
          expanded: false,
          needReview: true,
          reportDepartment: ['质量监督部'],
          reportUsers: ['陈十四'],
          reviewDepartment: ['验收委员会'],
          reviewUsers: ['刘十五', '杨十六', '黄十七'],
          warningBaseNode: '',
          warningDays: 10,
          children: []
        },
        {
          id: 'node5',
          name: '项目归档',
          level: 2,
          sortOrder: 5,
          expanded: false,
          needReview: false,
          reportDepartment: ['档案管理部'],
          reportUsers: ['朱十八'],
          reviewDepartment: [],
          reviewUsers: [],
          warningBaseNode: '',
          warningDays: 3,
          children: []
        }
      ]
    }
  },
  {
    id: 'template2',
    name: '简化项目流程',
    nodes: {
      id: 'root',
      name: '项目流程',
      level: 1,
      sortOrder: 0,
      expanded: true,
      needReview: false,
      reportDepartment: [],
      reportUsers: [],
      reviewDepartment: [],
      reviewUsers: [],
      warningBaseNode: '',
      warningDays: 0,
      children: [
        {
          id: 'node1',
          name: '项目启动',
          level: 2,
          sortOrder: 1,
          expanded: false,
          needReview: true,
          reportDepartment: ['项目管理部'],
          reportUsers: ['张三'],
          reviewDepartment: ['规划审批部'],
          reviewUsers: ['王五'],
          warningBaseNode: '',
          warningDays: 5,
          children: []
        },
        {
          id: 'node2',
          name: '项目完成',
          level: 2,
          sortOrder: 2,
          expanded: false,
          needReview: true,
          reportDepartment: ['工程部'],
          reportUsers: ['郑十一'],
          reviewDepartment: ['验收委员会'],
          reviewUsers: ['刘十五'],
          warningBaseNode: '',
          warningDays: 3,
          children: []
        }
      ]
    }
  }
])

const currentTemplateId = ref('template1')
const rootNode = reactive(JSON.parse(JSON.stringify(templates[0].nodes)))
const selectedNode = ref(null)
const showModal = ref(false)
const isEdit = ref(false)
const showCreateTemplateModal = ref(false)
const showRenameTemplateModal = ref(false)
const newTemplateName = ref('')
const renameTemplateName = ref('')
const copyFromTemplateId = ref('')

const formData = reactive({
  name: '',
  sortOrder: 1,
  needReview: false,
  reportDepartment: '',
  reportUsers: [],
  reviewDepartment: '',
  reviewUsers: [],
  attachments: []
})

// 获取可用的预警基准节点列表（编辑弹窗用）
const availableWarningNodes = computed(() => {
  const nodes = []
  const collectNodes = (node) => {
    if (node.id !== 'root' && node.name !== (selectedNode.value?.name || '')) {
      nodes.push({ id: node.id, name: node.name })
    }
    if (node.children) {
      node.children.forEach(child => collectNodes(child))
    }
  }
  collectNodes(rootNode)
  return nodes
})

// 获取可用的预警基准节点列表（详情面板用）
const availableWarningNodesForDisplay = computed(() => {
  const nodes = []
  const collectNodes = (node) => {
    if (node.id !== 'root' && node.name !== (selectedNode.value?.name || '')) {
      nodes.push({ id: node.id, name: node.name })
    }
    if (node.children) {
      node.children.forEach(child => collectNodes(child))
    }
  }
  collectNodes(rootNode)
  return nodes
})

// 切换模板
const switchTemplate = () => {
  const template = templates.find(t => t.id === currentTemplateId.value)
  if (template) {
    Object.assign(rootNode, JSON.parse(JSON.stringify(template.nodes)))
    selectedNode.value = null
  }
}

// 深度克隆节点
const cloneNode = (node) => {
  return JSON.parse(JSON.stringify(node))
}

// 创建模板
const createTemplate = () => {
  if (!newTemplateName.value.trim()) {
    alert('请输入模板名称')
    return
  }

  let newNodes
  if (copyFromTemplateId.value) {
    const sourceTemplate = templates.find(t => t.id === copyFromTemplateId.value)
    newNodes = cloneNode(sourceTemplate.nodes)
  } else {
    newNodes = createDefaultNode()
  }

  const newTemplate = {
    id: 'template' + Date.now(),
    name: newTemplateName.value,
    nodes: newNodes
  }

  templates.push(newTemplate)
  currentTemplateId.value = newTemplate.id
  switchTemplate()

  newTemplateName.value = ''
  copyFromTemplateId.value = ''
  showCreateTemplateModal.value = false
}

// 重命名模板
const renameTemplate = () => {
  if (!renameTemplateName.value.trim()) {
    alert('请输入新模板名称')
    return
  }

  const template = templates.find(t => t.id === currentTemplateId.value)
  if (template) {
    template.name = renameTemplateName.value
  }

  renameTemplateName.value = ''
  showRenameTemplateModal.value = false
}

// 删除模板
const deleteTemplate = () => {
  if (templates.length <= 1) {
    alert('至少保留一个模板')
    return
  }

  if (confirm(`确定要删除模板 "${templates.find(t => t.id === currentTemplateId.value)?.name}" 吗？`)) {
    const index = templates.findIndex(t => t.id === currentTemplateId.value)
    if (index > -1) {
      templates.splice(index, 1)
      currentTemplateId.value = templates[0].id
      switchTemplate()
    }
  }
}

// 保存当前模板
const saveCurrentTemplate = () => {
  const template = templates.find(t => t.id === currentTemplateId.value)
  if (template) {
    template.nodes = cloneNode(rootNode)
  }
}

const selectNode = (node) => {
  selectedNode.value = node
}

const toggleExpand = (node) => {
  node.expanded = !node.expanded
}

const addNode = () => {
  isEdit.value = false
  resetForm()
  if (selectedNode.value) {
    const parent = selectedNode.value.level === 1 ? selectedNode.value : rootNode
    formData.sortOrder = parent.children.length + 1
  } else {
    formData.sortOrder = rootNode.children.length + 1
  }
  showModal.value = true
}

const addChildNode = () => {
  isEdit.value = false
  resetForm()
  if (selectedNode.value) {
    formData.sortOrder = selectedNode.value.children.length + 1
  }
  showModal.value = true
}

const editNode = () => {
  if (!selectedNode.value) return
  isEdit.value = true
  fillForm(selectedNode.value)
  showModal.value = true
}

const deleteNode = () => {
  if (!selectedNode.value || selectedNode.value.id === 'root') return
  if (confirm(`确定要删除节点 "${selectedNode.value.name}" 吗？`)) {
    const parent = findParentNode(rootNode, selectedNode.value.id)
    if (parent) {
      const index = parent.children.findIndex(n => n.id === selectedNode.value.id)
      if (index > -1) {
        parent.children.splice(index, 1)
      }
    }
    selectedNode.value = null
    saveCurrentTemplate()
  }
}

const findParentNode = (node, targetId) => {
  for (const child of node.children) {
    if (child.id === targetId) return node
    const found = findParentNode(child, targetId)
    if (found) return found
  }
  return null
}

const resetForm = () => {
  formData.name = ''
  formData.sortOrder = 1
  formData.needReview = false
  formData.reportDepartment = ''
  formData.reportUsers = []
  formData.reviewDepartment = ''
  formData.reviewUsers = []
  formData.attachments = []
}

const fillForm = (node) => {
  formData.name = node.name
  formData.sortOrder = node.sortOrder || 1
  formData.needReview = node.needReview
  formData.reportDepartment = node.reportDepartment || ''
  formData.reportUsers = [...(node.reportUsers || [])]
  formData.reviewDepartment = node.reviewDepartment || ''
  formData.reviewUsers = [...(node.reviewUsers || [])]
  formData.attachments = [...(node.attachments || [])]
}

const addAttachment = () => {
  formData.attachments.push({
    type: '时间',
    name: ''
  })
}

const removeAttachment = (index) => {
  formData.attachments.splice(index, 1)
}

const closeModal = () => {
  showModal.value = false
  resetForm()
}

const saveNode = () => {
  if (!formData.name.trim()) {
    alert('请输入节点名称')
    return
  }
  if (formData.sortOrder < 1) {
    alert('排序序号不能小于1')
    return
  }

  if (isEdit.value && selectedNode.value) {
    const node = selectedNode.value
    node.name = formData.name
    node.sortOrder = formData.sortOrder
    node.needReview = formData.needReview
    node.reportDepartment = formData.reportDepartment
    node.reportUsers = [...formData.reportUsers]
    node.reviewDepartment = formData.reviewDepartment
    node.reviewUsers = [...formData.reviewUsers]
    node.attachments = [...formData.attachments]
  } else {
    const newNode = {
      id: 'node' + Date.now(),
      name: formData.name,
      sortOrder: formData.sortOrder,
      level: selectedNode.value ? selectedNode.value.level + 1 : 2,
      expanded: false,
      needReview: formData.needReview,
      reportDepartment: formData.reportDepartment,
      reportUsers: [...formData.reportUsers],
      reviewDepartment: formData.reviewDepartment,
      reviewUsers: [...formData.reviewUsers],
      attachments: [...formData.attachments],
      children: []
    }
    if (selectedNode.value) {
      selectedNode.value.children.push(newNode)
      selectedNode.value.expanded = true
    } else {
      rootNode.children.push(newNode)
    }
  }

  saveCurrentTemplate()
  closeModal()
}
